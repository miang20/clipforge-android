name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clipforge-debug-signing-v1
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate stable debug signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build APK and show concise error
        shell: bash
        run: |
          set +e
          gradle assembleDebug --console=plain --warning-mode=none > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "::group::COMPILATION ERRORS (read this section)"
            grep -n -E -A 8 '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed|^> |error:|Could not |SDK location|License for package)' build.log | tail -110 || true
            echo "::endgroup::"
            echo "::error::APK compilation failed; see COMPILATION ERRORS above and build-log artifact."
          else
            echo "BUILD SUCCESSFUL"
          fi
          exit "$result"
      - name: Publish failure details to repository issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Latest Android build failure'
            echo
            echo 'Commit: ${{ github.sha }}'
            echo
            echo '```text'
            grep -E -A 12 '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed|^> |error:|Could not |SDK location)' build.log | tail -100 || tail -80 build.log
            echo '```'
          } > failure.md
          gh issue create --title "Automated APK build failure ${GITHUB_SHA:0:8}" --body-file failure.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipForge-build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ClipForge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish directly downloadable complete APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk ClipForge-Monster-Edition.apk
          gh release view latest-apk >/dev/null 2>&1 || gh release create latest-apk --title "ClipForge Monster Edition — Latest Complete APK" --notes "Full Android APK. Debug-signed test build; not a Play Store release." --prerelease
          gh release upload latest-apk ClipForge-Monster-Edition.apk --clobber
